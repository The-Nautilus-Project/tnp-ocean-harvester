# TNP Gibraltar Ocean Observatory - harvester configuration
# ------------------------------------------------------------------
# Areas are used for gridded satellite products (statistics over all
# valid pixels in the box). Points are used for model/station series
# (nearest valid sea cell is used). Longitudes are degrees east.

areas:
  bay_of_gibraltar:
    name: Bay of Gibraltar
    bbox: [-5.45, 36.07, -5.35, 36.18]      # [lon_min, lat_min, lon_max, lat_max]
  gibraltar_eastside:
    name: Gibraltar Eastside
    bbox: [-5.34, 36.08, -5.27, 36.18]
  strait_of_gibraltar:
    name: Strait of Gibraltar
    bbox: [-5.75, 35.85, -5.40, 36.05]
  western_alboran:
    name: Western Alboran Sea
    bbox: [-5.25, 35.90, -4.50, 36.40]
  gibraltar_20km:
    name: Gibraltar 20 km box
    bbox: [-5.50, 36.00, -5.20, 36.25]

points:
  europa_point:
    name: Europa Point offshore
    lat: 36.09
    lon: -5.33
  bay_centre:
    name: Bay of Gibraltar centre
    lat: 36.12
    lon: -5.40
  gibraltar_airport:
    name: Gibraltar Airport (LXGB)
    lat: 36.151
    lon: -5.349
  gibraltar_tide_gauge:
    name: Gibraltar tide gauge
    lat: 36.1482
    lon: -5.3649
  aeronet_malaga:            # location code used automatically for AERONET site "Malaga"
    name: AERONET Malaga
    lat: 36.715
    lon: -4.478

# Default start for "as far back as the source allows" backfills.
# Each source clips this to its own coverage.
backfill_start: "1982-01-01"

sources:

  # ---------------- Copernicus Marine (free account needed) ----------------
  cmems_med_chl_my:
    label: Copernicus reprocessed (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km, multi-year (reprocessed)
    dataset_id: cmems_obs-oc_med_bgc-plankton_my_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: {CHL: chl}
    earliest: "1997-09-16"
    chunk_days: 365
    lookback_days: 10

  cmems_med_chl_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km, near real time
    dataset_id: cmems_obs-oc_med_bgc-plankton_nrt_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: {CHL: chl}
    rolling_window_days: 30          # NRT only keeps recent weeks online
    lookback_days: 7

  cmems_med_kd490_my:
    label: Copernicus reprocessed (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean transparency (KD490) L3 multi-sensor 1 km, multi-year
    dataset_id: cmems_obs-oc_med_bgc-transp_my_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: {KD490: kd490}
    earliest: "1997-09-16"
    chunk_days: 365
    lookback_days: 10

  cmems_med_kd490_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean transparency (KD490) L3 multi-sensor 1 km, near real time
    dataset_id: cmems_obs-oc_med_bgc-transp_nrt_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: {KD490: kd490}
    rolling_window_days: 30
    lookback_days: 7

  cmems_med_sst_rep:
    label: Copernicus reprocessed
    enabled: true
    type: copernicus_grid
    description: Mediterranean L4 foundation SST 0.05 deg, reprocessed
    dataset_id: cmems_SST_MED_SST_L4_REP_OBSERVATIONS_010_021
    product: SST_MED_SST_L4_REP_OBSERVATIONS_010_021
    variables: {analysed_sst: sst}
    kelvin_to_celsius: [analysed_sst]
    earliest: "1982-01-01"
    chunk_days: 730
    lookback_days: 10

  cmems_med_sst_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean L4 foundation SST 1/100 deg, near real time
    dataset_id: SST_MED_SST_L4_NRT_OBSERVATIONS_010_004_c_V2
    product: SST_MED_SST_L4_NRT_OBSERVATIONS_010_004
    variables: {analysed_sst: sst}
    kelvin_to_celsius: [analysed_sst]
    earliest: "2008-01-01"
    chunk_days: 365
    lookback_days: 5

  cmems_med_waves_my:
    label: Copernicus wave reanalysis
    enabled: true
    type: copernicus_point
    description: Mediterranean wave reanalysis 4.2 km, hourly
    dataset_id: cmems_mod_med_wav_my_4.2km_PT1H-i
    product: MEDSEA_MULTIYEAR_WAV_006_012
    variables: {VHM0: wave_hs, VMDR: wave_dir, VTPK: wave_tp}   # Tm-10 dropped: peak period covers it
    points: [europa_point, bay_centre]
    earliest: "1991-01-01"   # matches the 1991-2020 heatwave baseline; hourly, so depth is costly
    chunk_days: 365
    lookback_days: 10

  cmems_med_waves_anfc:
    label: Copernicus wave forecast
    enabled: true
    type: copernicus_point
    description: Mediterranean wave analysis and forecast 4.2 km, hourly
    dataset_id: cmems_mod_med_wav_anfc_4.2km_PT1H-i
    product: MEDSEA_ANALYSISFORECAST_WAV_006_017
    variables: {VHM0: wave_hs, VMDR: wave_dir, VTPK: wave_tp}   # Tm-10 dropped: peak period covers it
    points: [europa_point, bay_centre]
    earliest: "2021-11-30"
    chunk_days: 180
    lookback_days: 3
    forecast_days: 5                  # also store the days ahead; published as a forecast

  # ---- Copernicus Marine: more satellite ocean colour (same login) ----
  cmems_med_pft_my:
    label: Copernicus reprocessed (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km, phytoplankton groups and size classes, multi-year
    dataset_id: cmems_obs-oc_med_bgc-plankton_my_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: &pft_vars
      DIATO:  {code: diatoms, match: diatom}
      DINO:   {code: dinoflagellates, match: dinophyte}
      HAPTO:  {code: haptophytes, match: haptophyte}
      CRYPTO: {code: cryptophytes, match: cryptophyte}
      GREEN:  {code: green_algae, match: greenalgae}
      PROKAR: {code: prokaryotes, match: prokaryote}
      MICRO:  {code: micro_phyto, match: microphytoplankton}
      NANO:   {code: nano_phyto, match: nanophytoplankton}
      PICO:   {code: pico_phyto, match: picophytoplankton}
    earliest: "1997-09-16"
    chunk_days: 365
    lookback_days: 10

  cmems_med_pft_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km, phytoplankton groups and size classes, near real time
    dataset_id: cmems_obs-oc_med_bgc-plankton_nrt_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: *pft_vars
    rolling_window_days: 30
    lookback_days: 7

  cmems_med_chl_olci_my:
    label: Copernicus OLCI 300 m (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 Sentinel-3 OLCI 300 m chlorophyll, multi-year
    dataset_id: cmems_obs-oc_med_bgc-plankton_my_l3-olci-300m_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: {CHL: chl}
    earliest: "2016-04-26"
    chunk_days: 60                   # 300 m pixels: smaller chunks keep memory use down
    lookback_days: 10

  cmems_med_chl_olci_nrt:
    label: Copernicus OLCI 300 m (near real time)
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 Sentinel-3 OLCI 300 m chlorophyll, near real time
    dataset_id: cmems_obs-oc_med_bgc-plankton_nrt_l3-olci-300m_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: {CHL: chl}
    rolling_window_days: 30
    lookback_days: 7

  cmems_med_kd490_olci_my:
    label: Copernicus OLCI 300 m (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean transparency L3 Sentinel-3 OLCI 300 m KD490, multi-year
    dataset_id: cmems_obs-oc_med_bgc-transp_my_l3-olci-300m_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: {KD490: kd490}
    earliest: "2016-04-26"
    chunk_days: 60
    lookback_days: 10

  cmems_med_kd490_olci_nrt:
    label: Copernicus OLCI 300 m (near real time)
    enabled: true
    type: copernicus_grid
    description: Mediterranean transparency L3 Sentinel-3 OLCI 300 m KD490, near real time
    dataset_id: cmems_obs-oc_med_bgc-transp_nrt_l3-olci-300m_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: {KD490: kd490}
    rolling_window_days: 30
    lookback_days: 7

  cmems_med_optics_my:
    label: Copernicus reprocessed (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km inherent optical properties, multi-year
    dataset_id: cmems_obs-oc_med_bgc-optics_my_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_MY_009_143
    variables: {ADG443: cdom_adg443, BBP443: bbp443}
    earliest: "1997-09-16"
    chunk_days: 365
    lookback_days: 10

  cmems_med_optics_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean ocean colour L3 multi-sensor 1 km inherent optical properties, near real time
    dataset_id: cmems_obs-oc_med_bgc-optics_nrt_l3-multi-1km_P1D
    product: OCEANCOLOUR_MED_BGC_L3_NRT_009_141
    variables: {ADG443: cdom_adg443, BBP443: bbp443}
    rolling_window_days: 30
    lookback_days: 7

  cmems_med_pp_my:
    label: Copernicus reprocessed (MY)
    enabled: true
    type: copernicus_grid
    description: Mediterranean satellite primary production L4 multi-sensor 4 km, multi-year
    dataset_id: cmems_obs-oc_med_bgc-pp_my_l4-multi-4km_P1D
    product: OCEANCOLOUR_MED_BGC_L4_MY_009_144
    variables: {PP: {code: pp_sat, match: primary}}
    earliest: "1997-09-16"
    chunk_days: 730
    lookback_days: 10

  cmems_med_pp_nrt:
    label: Copernicus near real time
    enabled: true
    type: copernicus_grid
    description: Mediterranean satellite primary production L4 multi-sensor 4 km, near real time
    dataset_id: cmems_obs-oc_med_bgc-pp_nrt_l4-multi-4km_P1D
    product: OCEANCOLOUR_MED_BGC_L4_NRT_009_142
    variables: {PP: {code: pp_sat, match: primary}}
    rolling_window_days: 30
    lookback_days: 7

  # ---- Copernicus Marine: Mediterranean physics model, top layer (same login) ----
  # MY = reanalysis from 1987, anfc = analysis and forecast carrying it on to today.
  cmems_med_cur_my:
    label: Copernicus physics reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics reanalysis 4.2 km, daily surface currents
    dataset_id: cmems_mod_med_phy-cur_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_PHY_006_004
    variables: {uo: current_u, vo: current_v}
    derive: currents                 # stores current speed and the direction the water flows towards
    max_depth: 1.5
    earliest: "1987-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_cur_anfc:
    label: Copernicus physics analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics analysis and forecast 4.2 km, daily surface currents
    dataset_id: cmems_mod_med_phy-cur_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_PHY_006_013
    variables: {uo: current_u, vo: current_v}
    derive: currents
    max_depth: 1.5
    earliest: "2023-11-01"
    chunk_days: 180
    lookback_days: 10
    forecast_days: 5

  cmems_med_sal_my:
    label: Copernicus physics reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics reanalysis 4.2 km, daily surface salinity
    dataset_id: cmems_mod_med_phy-sal_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_PHY_006_004
    variables: {so: salinity}
    max_depth: 1.5
    earliest: "1987-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_sal_anfc:
    label: Copernicus physics analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics analysis and forecast 4.2 km, daily surface salinity
    dataset_id: cmems_mod_med_phy-sal_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_PHY_006_013
    variables: {so: salinity}
    max_depth: 1.5
    earliest: "2023-11-01"
    chunk_days: 180
    lookback_days: 10

  cmems_med_temp_my:
    label: Copernicus physics reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics reanalysis 4.2 km, daily temperature from the surface to 100 m
    dataset_id: cmems_mod_med_phy-temp_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_PHY_006_004
    variables: &temp_vars
      thetao: {code: temp, surface_code: temp_surface, depths: [10, 20, 30, 50, 100]}
    max_depth: 110
    earliest: "1987-01-01"
    chunk_days: 180
    lookback_days: 10

  cmems_med_temp_anfc:
    label: Copernicus physics analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics analysis and forecast 4.2 km, daily temperature from the surface to 100 m
    dataset_id: cmems_mod_med_phy-tem_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_PHY_006_013
    variables: *temp_vars
    max_depth: 110
    earliest: "2023-11-01"
    chunk_days: 120
    lookback_days: 10
    forecast_days: 5

  cmems_med_salprof_my:
    label: Copernicus physics reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics reanalysis 4.2 km, daily salinity to 350 m and the Atlantic-Mediterranean interface depth
    dataset_id: cmems_mod_med_phy-sal_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_PHY_006_004
    variables: &salprof_vars
      so: {code: salinity, depths: [50, 100, 200], interface: {code: interface_depth, value: 37.5}}
    max_depth: 350
    earliest: "1987-01-01"
    chunk_days: 120
    lookback_days: 10

  cmems_med_salprof_anfc:
    label: Copernicus physics analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics analysis and forecast 4.2 km, daily salinity to 350 m and the Atlantic-Mediterranean interface depth
    dataset_id: cmems_mod_med_phy-sal_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_PHY_006_013
    variables: *salprof_vars
    max_depth: 350
    earliest: "2023-11-01"
    chunk_days: 90
    lookback_days: 10

  cmems_med_mld_my:
    label: Copernicus physics reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics reanalysis 4.2 km, daily mixed layer depth
    dataset_id: cmems_mod_med_phy-mld_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_PHY_006_004
    variables: {mlotst: mld}
    earliest: "1987-01-01"
    chunk_days: 730
    lookback_days: 10

  cmems_med_mld_anfc:
    label: Copernicus physics analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean physics analysis and forecast 4.2 km, daily mixed layer depth
    dataset_id: cmems_mod_med_phy-mld_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_PHY_006_013
    variables: {mlotst: mld}
    earliest: "2023-11-01"
    chunk_days: 365
    lookback_days: 10

  # ---- Copernicus Marine: Mediterranean biogeochemistry model, top layer (same login) ----
  cmems_med_nut_my:
    label: Copernicus biogeochemistry reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry reanalysis 4.2 km, daily surface nutrients
    dataset_id: cmems_mod_med_bgc-nut_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_BGC_006_008
    variables: &nut_vars {no3: nitrate, po4: phosphate, nh4: ammonium}
    max_depth: 1.5
    earliest: "1999-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_nut_anfc:
    label: Copernicus biogeochemistry analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry analysis and forecast 4.2 km, daily surface nutrients
    dataset_id: cmems_mod_med_bgc-nut_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_BGC_006_014
    variables: *nut_vars
    max_depth: 1.5
    earliest: "2023-10-01"
    chunk_days: 180
    lookback_days: 10

  cmems_med_bio_my:
    label: Copernicus biogeochemistry reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry reanalysis 4.2 km, daily surface oxygen and net primary production
    dataset_id: cmems_mod_med_bgc-bio_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_BGC_006_008
    variables: &bio_vars {o2: oxygen, nppv: npp_model}
    max_depth: 1.5
    earliest: "1999-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_bio_anfc:
    label: Copernicus biogeochemistry analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry analysis and forecast 4.2 km, daily surface oxygen and net primary production
    dataset_id: cmems_mod_med_bgc-bio_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_BGC_006_014
    variables: *bio_vars
    max_depth: 1.5
    earliest: "2023-10-01"
    chunk_days: 180
    lookback_days: 10

  cmems_med_car_my:
    label: Copernicus biogeochemistry reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry reanalysis 4.2 km, daily surface pH, dissolved inorganic carbon and alkalinity
    dataset_id: cmems_mod_med_bgc-car_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_BGC_006_008
    variables: &car_vars
      ph: ph
      dissic: {code: dic, scale: 1000}          # mol m-3 -> mmol m-3
      talk: {code: alkalinity, scale: 1000}     # mol m-3 -> mmol m-3
    max_depth: 1.5
    earliest: "1999-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_car_anfc:
    label: Copernicus biogeochemistry analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry analysis and forecast 4.2 km, daily surface pH, dissolved inorganic carbon and alkalinity
    dataset_id: cmems_mod_med_bgc-car_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_BGC_006_014
    variables: *car_vars
    max_depth: 1.5
    earliest: "2023-10-01"
    chunk_days: 180
    lookback_days: 10

  cmems_med_co2_my:
    label: Copernicus biogeochemistry reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry reanalysis 4.2 km, daily surface partial pressure of CO2
    dataset_id: cmems_mod_med_bgc-co2_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_BGC_006_008
    variables: &co2_vars
      spco2: {code: pco2, scale: 9.86923}       # Pa -> micro-atmospheres
    earliest: "1999-01-01"
    chunk_days: 730
    lookback_days: 10

  cmems_med_co2_anfc:
    label: Copernicus biogeochemistry analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry analysis and forecast 4.2 km, daily surface partial pressure of CO2
    dataset_id: cmems_mod_med_bgc-co2_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_BGC_006_014
    variables: *co2_vars
    earliest: "2023-10-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_phyto_my:
    label: Copernicus biogeochemistry reanalysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry reanalysis 4.2 km, daily surface phytoplankton carbon
    dataset_id: cmems_mod_med_bgc-plankton_my_4.2km_P1D-m
    product: MEDSEA_MULTIYEAR_BGC_006_008
    variables: {phyc: phyto_carbon}
    max_depth: 1.5
    earliest: "1999-01-01"
    chunk_days: 365
    lookback_days: 10

  cmems_med_phyto_anfc:
    label: Copernicus biogeochemistry analysis
    enabled: true
    type: copernicus_grid
    description: Mediterranean biogeochemistry analysis and forecast 4.2 km, daily surface phytoplankton and zooplankton carbon
    dataset_id: cmems_mod_med_bgc-pft_anfc_4.2km_P1D-m
    product: MEDSEA_ANALYSISFORECAST_BGC_006_014
    variables: {phyc: phyto_carbon, zooc: zoo_carbon}
    max_depth: 1.5
    earliest: "2023-10-01"
    chunk_days: 180
    lookback_days: 10

  # ---------------- NASA Ocean Biology DAAC (free Earthdata login) ----------------
  nasa_par_seawifs:
    label: NASA SeaWiFS
    enabled: true
    type: nasa_l3m
    optional: true               # urs.earthdata.nasa.gov times out often enough
                                 # that PAR must not be able to fail the harvest
    description: SeaWiFS L3 mapped daily PAR 9 km
    short_name: SEASTAR_SEAWIFS_GAC_L3m_PAR
    granule_pattern: "*.L3m.DAY.PAR.par.9km*"
    variable: par
    code: par
    earliest: "1997-09-04"
    latest: "2010-12-11"
    lookback_days: 0

  nasa_par_modisa:
    label: NASA MODIS-Aqua
    enabled: true
    type: nasa_l3m
    optional: true               # urs.earthdata.nasa.gov times out often enough
                                 # that PAR must not be able to fail the harvest
    description: MODIS-Aqua L3 mapped daily PAR 4 km
    short_name: MODISA_L3m_PAR
    granule_pattern: "*.L3m.DAY.PAR.par.4km*"
    variable: par
    code: par
    earliest: "2002-07-04"
    latest: "2026-06-19"               # no MODIS-Aqua PAR published after this; PACE carries the record on
    lookback_days: 10

  nasa_par_pace_nrt:
    label: NASA PACE
    enabled: true
    type: nasa_l3m
    optional: true               # urs.earthdata.nasa.gov times out often enough
                                 # that PAR must not be able to fail the harvest
    description: PACE OCI L3 mapped daily PAR 4 km, near real time
    short_name: PACE_OCI_L3M_PAR_NRT
    granule_pattern: "*.L3m.DAY.PAR*.4km*"
    variable: par_day_planar_above     # PACE's name for daily PAR just above the sea surface (MODIS calls it 'par')
    code: par
    earliest: "2024-03-05"
    lookback_days: 10

  # ---------------- Weather station: Gibraltar Airport (no account) ----------------
  ncei_isd_lxgb:
    label: Gibraltar Airport station (NOAA)
    enabled: true
    type: ncei_isd
    description: NOAA NCEI Integrated Surface Database, Gibraltar (LXGB) hourly reports
    station_id: "08495099999"
    point: gibraltar_airport
    earliest: "1991-01-01"   # matches the 1991-2020 heatwave baseline; hourly, so depth is costly
    chunk_days: 365              # one file per station per year: ask once per year, not once per month
    lookback_days: 5

  # ---- Copernicus Marine: satellite altimetry, for sea level rise ----
  # Daily maps of how high the sea stands against a 1993-2012 average. The tide gauge shows today's
  # water level; this is the only thing here that shows the trend underneath it.
  cmems_sealevel_my:
    label: Copernicus altimetry (reprocessed)
    enabled: true
    type: copernicus_grid
    description: European seas gridded sea level anomaly and absolute dynamic topography, 0.0625 deg, reprocessed
    dataset_id: cmems_obs-sl_eur_phy-ssh_my_allsat-l4-duacs-0.0625deg_P1D
    product: SEALEVEL_EUR_PHY_L4_MY_008_068
    variables:
      sla: {code: sea_level_anomaly, match: "above sea level"}
    earliest: "1993-01-01"
    chunk_days: 1825                 # coarse grid, small area: long chunks are cheap
    lookback_days: 30                # reprocessed data lands months late

  cmems_sealevel_nrt:
    label: Copernicus altimetry (near real time)
    enabled: true
    type: copernicus_grid
    description: European seas gridded sea level anomaly, 0.0625 deg, near real time
    dataset_id: cmems_obs-sl_eur_phy-ssh_nrt_allsat-l4-duacs-0.0625deg_P1D
    product: SEALEVEL_EUR_PHY_L4_NRT_008_060
    variables:
      sla: {code: sea_level_anomaly, match: "above sea level"}
    earliest: "2022-10-04"
    chunk_days: 365
    lookback_days: 10

  # ---------------- EMODnet Physics (no account, CC-BY) ----------------
  # Surface currents across the Strait, measured hourly by the Puertos del Estado HF radar network
  # and redistributed by EMODnet. Everything else we hold for the Strait is a model.
  emodnet_hfradar_strait:
    label: HF radar, Strait of Gibraltar
    enabled: true
    type: erddap_grid
    description: Puertos del Estado HF radar surface currents via EMODnet Physics, hourly, ~1 km
    server: https://erddap.emodnet-physics.eu/erddap
    dataset_id: EUHFR_NRTcurrent_HFR-Gibraltar-Total
    area: strait_of_gibraltar
    grid_limits: [-5.848, 35.806, -4.995, 36.192]   # the radar footprint; griddap errors outside it
    u: EWCT
    v: NSCT
    qc_variables: [QCflag]           # 1 = passed every test; anything else is dropped
    depth: 0.0                       # surface only
    codes:
      speed: hf_current_speed
      dir: hf_current_dir
    earliest: "2019-10-30"
    chunk_days: 10                   # hourly on a 44 x 78 grid: small bites
    lookback_days: 5

  # ---------------- Global Fishing Watch (free token, CC BY-NC) ----------------
  # Apparent fishing effort inferred from AIS. Non-commercial use only, and the credit travels with
  # the numbers, so "Powered by Global Fishing Watch" has to stay on the page.
  gfw_fishing_strait:
    label: Global Fishing Watch
    enabled: true
    type: gfw_fishing_effort
    optional: true                   # a fishing token problem must not fail the whole harvest
    description: Apparent fishing hours from AIS, aggregated over the Strait of Gibraltar
    area: strait_of_gibraltar
    group_by: FLAG
    codes:
      hours: fishing_hours
      flags: fishing_flags
    earliest: "2012-01-01"
    chunk_days: 90
    lookback_days: 10                # GFW revises recent days as more AIS arrives

  # ---------------- Open-Meteo (no account, non-commercial use) ----------------
  openmeteo_era5:
    label: ERA5 reanalysis
    enabled: true
    type: openmeteo_archive
    description: ERA5 reanalysis via Open-Meteo, hourly wind, rain, air temperature, pressure, solar radiation
    points: [gibraltar_airport]
    model: era5
    variables:
      wind_speed_10m: wind_speed
      wind_direction_10m: wind_dir
      wind_gusts_10m: wind_gust
      precipitation: precip
      temperature_2m: air_temp
      pressure_msl: slp                # sea level pressure; the airport station feed stopped in Aug 2025
      shortwave_radiation: sw_rad      # used for the ERA5 PAR estimate
    earliest: "1991-01-01"   # matches the 1991-2020 heatwave baseline; hourly, so depth is costly
    chunk_days: 365
    lookback_days: 10

  openmeteo_cams_dust:
    label: CAMS forecast
    enabled: true
    type: openmeteo_airquality
    description: CAMS atmospheric composition via Open-Meteo, hourly dust, aerosols and air quality
    points: [gibraltar_airport]
    variables:
      dust: dust_sfc
      aerosol_optical_depth: aod_550
      pm10: pm10
      pm2_5: pm2_5
      nitrogen_dioxide: no2
      ozone: ozone
      uv_index: uv_index
    earliest: "2022-08-01"
    chunk_days: 90
    lookback_days: 5

  openmeteo_forecast:
    label: Open-Meteo forecast
    enabled: true
    type: openmeteo_forecast
    description: Weather forecast models via Open-Meteo, hourly wind, gusts, rain, air temperature and pressure for the last week and the week ahead
    points: [gibraltar_airport]
    variables:
      wind_speed_10m: wind_speed
      wind_direction_10m: wind_dir
      wind_gusts_10m: wind_gust
      precipitation: precip
      temperature_2m: air_temp
      pressure_msl: slp
    past_days: 7                     # fills the few days ERA5 lags behind
    forecast_days: 7
    rolling_window_days: 7
    lookback_days: 7
    chunk_days: 60

  # ---------------- Tide gauge (no account) ----------------
  ioc_gibraltar:
    label: Gibraltar tide gauge (IOC)
    enabled: true
    type: ioc_sealevel
    description: IOC Sea Level Station Monitoring Facility, Gibraltar tide gauge (National Oceanography Centre for the Gibraltar Port Authority), averaged to hourly
    stations: [gibr3, gibr]          # current gauge first, then the earlier one
    point: gibraltar_tide_gauge
    sensors: [rad, pr1, prs, flt, enc, bub]   # radar first; pr2 is not a sea level record
    earliest: "2005-01-01"
    chunk_days: 60
    request_days: 3                  # the older gauge reports every 10 seconds, so keep requests small
    retry_daily: true                # if a window comes back empty, ask again one day at a time
    lookback_days: 3

  # ---------------- CAMS reanalysis (free ADS account) ----------------
  cams_eac4_dust:
    label: CAMS reanalysis (EAC4)
    enabled: true
    type: cams_eac4
    description: CAMS global reanalysis EAC4, 3-hourly dust and total AOD at 550 nm
    point: europa_point
    variables:
      duaod550: dust_aod_550
      aod550: aod_550
    earliest: "2003-01-01"
    chunk_days: 92
    lookback_days: 0
    skip_daily_update: true        # EAC4 lags real time; the backfill workflow keeps it filled

  # ---------------- AERONET sun photometers (no account) ----------------
  aeronet:
    label: AERONET Málaga
    # Off: the Málaga sun photometer has returned no rows on every run since August 2026. Dust is
    # covered by CAMS. Turn this back on if the site starts reporting again.
    enabled: false
    type: aeronet
    description: NASA AERONET v3 Level 1.5 daily averages
    sites: [Malaga]
    earliest: "1993-01-01"
    lookback_days: 10

# Variables the dashboard knows about
# group: physical, chemical or biological (how the dashboard sorts them)
# valid_range: values outside it are treated as bad pixels and ignored.
# daily_statistic: which area statistic the dashboard uses (median resists stray coastal pixels).
variables:
  # ---- physical ----
  sst:          {group: physical, name: "Sea surface temperature (foundation)", unit: degC, valid_range: [5, 35]}
  par:          {group: physical, name: "Photosynthetically available radiation", unit: einstein m-2 day-1, valid_range: [0, 130]}
  kd490:        {group: physical, name: "Diffuse attenuation at 490 nm", unit: m-1, valid_range: [0.01, 6], daily_statistic: median}
  current_speed: {group: physical, name: "Surface current speed (model)", unit: m s-1, valid_range: [0, 5]}
  current_dir:  {group: physical, name: "Surface current direction (towards)", unit: deg}
  salinity:     {group: physical, name: "Sea surface salinity (model)", unit: PSU, valid_range: [30, 40]}
  salinity_50m: {group: physical, name: "Salinity at 50 m (model)", unit: PSU, valid_range: [30, 40]}
  salinity_100m: {group: physical, name: "Salinity at 100 m (model)", unit: PSU, valid_range: [30, 40]}
  salinity_200m: {group: physical, name: "Salinity at 200 m (model)", unit: PSU, valid_range: [30, 40]}
  interface_depth: {group: physical, name: "Depth of the Atlantic-Mediterranean interface (37.5 isohaline, model)", unit: m, valid_range: [0, 400]}
  temp_surface: {group: physical, name: "Sea temperature at the surface (model)", unit: degC, valid_range: [5, 35]}
  temp_10m:     {group: physical, name: "Sea temperature at 10 m (model)", unit: degC, valid_range: [5, 35]}
  temp_20m:     {group: physical, name: "Sea temperature at 20 m (model)", unit: degC, valid_range: [5, 35]}
  temp_30m:     {group: physical, name: "Sea temperature at 30 m (model)", unit: degC, valid_range: [5, 35]}
  temp_50m:     {group: physical, name: "Sea temperature at 50 m (model)", unit: degC, valid_range: [5, 35]}
  temp_100m:    {group: physical, name: "Sea temperature at 100 m (model)", unit: degC, valid_range: [5, 35]}
  sea_level_anomaly: {group: physical, name: "Sea level against the 1993-2012 average (satellite)", unit: m, valid_range: [-1.5, 1.5]}
  hf_current_speed: {group: physical, name: "Surface current speed (HF radar, measured)", unit: m s-1, valid_range: [0, 5]}
  hf_current_dir: {group: physical, name: "Surface current direction (HF radar, towards)", unit: deg}
  fishing_hours: {group: traffic, name: "Apparent fishing hours", unit: hours, valid_range: [0, 100000]}
  fishing_flags: {group: traffic, name: "Countries fishing here", unit: count, valid_range: [0, 100]}
  upwelling_index: {group: physical, name: "Upwelling index (offshore Ekman transport, NW Alboran coast)", unit: m3 s-1 km-1}
  par_5m:       {group: physical, name: "Light (PAR) reaching 5 m", unit: einstein m-2 day-1, valid_range: [0, 130]}
  par_10m:      {group: physical, name: "Light (PAR) reaching 10 m", unit: einstein m-2 day-1, valid_range: [0, 130]}
  par_15m:      {group: physical, name: "Light (PAR) reaching 15 m", unit: einstein m-2 day-1, valid_range: [0, 130]}
  par_20m:      {group: physical, name: "Light (PAR) reaching 20 m", unit: einstein m-2 day-1, valid_range: [0, 130]}
  sea_level_hourly: {group: physical, name: "Sea level (hourly, gauge datum)", unit: m}
  sea_level:    {group: physical, name: "Daily mean sea level, against the past year", unit: m, valid_range: [-1, 1]}
  surge:        {group: physical, name: "Surge (sea level minus predicted tide)", unit: m, valid_range: [-1.5, 1.5]}
  mld:          {group: physical, name: "Mixed layer depth (model)", unit: m, valid_range: [0, 1000]}
  wave_hs:      {group: physical, name: "Significant wave height", unit: m, valid_range: [0, 20]}
  wave_dir:     {group: physical, name: "Mean wave direction (from)", unit: deg}
  wave_tp:      {group: physical, name: "Peak wave period", unit: s, valid_range: [0, 30]}
  wind_speed:   {group: physical, name: "Wind speed at 10 m", unit: m s-1, valid_range: [0, 75]}
  wind_dir:     {group: physical, name: "Wind direction (from)", unit: deg}
  wind_gust:    {group: physical, name: "Wind gust", unit: m s-1}
  precip:       {group: physical, name: "Precipitation", unit: mm}
  precip_1h:    {group: physical, name: "Precipitation (station, 1 h)", unit: mm}
  precip_3h:    {group: physical, name: "Precipitation (station, 3 h)", unit: mm}
  precip_6h:    {group: physical, name: "Precipitation (station, 6 h)", unit: mm}
  precip_12h:   {group: physical, name: "Precipitation (station, 12 h)", unit: mm}
  precip_24h:   {group: physical, name: "Precipitation (station, 24 h)", unit: mm}
  slp:          {group: physical, name: "Sea level pressure", unit: hPa, valid_range: [940, 1060]}
  precip_7d:    {group: physical, name: "Rainfall over the last 7 days", unit: mm, valid_range: [0, 1500]}
  precip_30d:   {group: physical, name: "Rainfall over the last 30 days", unit: mm, valid_range: [0, 3000]}
  air_temp:     {group: physical, name: "Air temperature", unit: degC}
  sw_rad:       {group: physical, name: "Incoming shortwave radiation (ERA5)", unit: W m-2}
  par_era5:     {group: physical, name: "PAR estimated from ERA5 shortwave radiation", unit: einstein m-2 day-1}
  bbp443:       {group: physical, name: "Particle backscattering at 443 nm", unit: m-1, valid_range: [0, 1], daily_statistic: median}
  # ---- chemical ----
  dust_sfc:     {group: chemical, name: "Surface dust concentration (CAMS)", unit: ug m-3, valid_range: [0, 20000]}
  aod_550:      {group: chemical, name: "Aerosol optical depth 550 nm", unit: "1"}
  dust_aod_550: {group: chemical, name: "Dust aerosol optical depth 550 nm", unit: "1"}
  pm10:         {group: chemical, name: "PM10 particles in the air", unit: ug m-3, valid_range: [0, 1000]}
  pm2_5:        {group: chemical, name: "PM2.5 particles in the air", unit: ug m-3, valid_range: [0, 500]}
  no2:          {group: chemical, name: "Nitrogen dioxide", unit: ug m-3, valid_range: [0, 500]}
  ozone:        {group: chemical, name: "Ozone", unit: ug m-3, valid_range: [0, 500]}
  uv_index:     {group: physical, name: "UV index", unit: index, valid_range: [0, 14]}
  aeronet_aod_500: {group: chemical, name: "AERONET aerosol optical depth 500 nm", unit: "1"}
  aeronet_ae_440_870: {group: chemical, name: "AERONET Angstrom exponent 440-870 nm", unit: "1"}
  nitrate:      {group: chemical, name: "Nitrate (model)", unit: mmol m-3, valid_range: [0, 50]}
  phosphate:    {group: chemical, name: "Phosphate (model)", unit: mmol m-3, valid_range: [0, 5]}
  ammonium:     {group: chemical, name: "Ammonium (model)", unit: mmol m-3, valid_range: [0, 20]}
  oxygen:       {group: chemical, name: "Dissolved oxygen (model)", unit: mmol m-3, valid_range: [100, 450]}
  ph:           {group: chemical, name: "pH (model)", unit: "1", valid_range: [7.5, 8.6]}
  dic:          {group: chemical, name: "Dissolved inorganic carbon (model)", unit: mmol m-3, valid_range: [1500, 3000]}
  alkalinity:   {group: chemical, name: "Total alkalinity (model)", unit: mmol m-3, valid_range: [1800, 3000]}
  pco2:         {group: chemical, name: "Surface partial pressure of CO2 (model)", unit: uatm, valid_range: [100, 1000]}
  cdom_adg443:  {group: chemical, name: "Absorption by dissolved organic matter and detritus at 443 nm", unit: m-1, valid_range: [0, 5], daily_statistic: median}
  # ---- biological ----
  chl:          {group: biological, name: "Chlorophyll-a", unit: mg m-3, valid_range: [0.01, 100], daily_statistic: median}
  diatoms:      {group: biological, name: "Diatoms (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  dinoflagellates: {group: biological, name: "Dinoflagellates (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  haptophytes:  {group: biological, name: "Haptophytes (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  cryptophytes: {group: biological, name: "Cryptophytes (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  green_algae:  {group: biological, name: "Green algae and prochlorophytes (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  prokaryotes:  {group: biological, name: "Prokaryotes (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  micro_phyto:  {group: biological, name: "Microphytoplankton (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  nano_phyto:   {group: biological, name: "Nanophytoplankton (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  pico_phyto:   {group: biological, name: "Picophytoplankton (as chlorophyll)", unit: mg m-3, valid_range: [0, 100], daily_statistic: median}
  pp_sat:       {group: biological, name: "Primary production, water column (satellite)", unit: g C m-2 day-1, valid_range: [0, 20], daily_statistic: median}
  npp_model:    {group: biological, name: "Net primary production at the surface (model)", unit: mg C m-3 day-1, valid_range: [0, 500]}
  phyto_carbon: {group: biological, name: "Phytoplankton carbon (model)", unit: mmol C m-3, valid_range: [0, 50]}
  zoo_carbon:   {group: biological, name: "Zooplankton carbon (model)", unit: mmol C m-3, valid_range: [0, 50]}

# Order of preference when the dashboard export merges overlapping sources
export:
  output_dir: public/data
  # Saharan dust days: a day is flagged when any indicator is above its threshold.
  dust:
    indicators:
      - {variable: dust_sfc, location: gibraltar_airport, threshold: 50}        # CAMS surface dust, daily mean ug m-3
      - {variable: dust_aod_550, location: europa_point, threshold: 0.2}        # CAMS EAC4 dust optical depth
      - {variable: aeronet_aod_500, location: aeronet_malaga, threshold: 0.3,   # AERONET: high AOD with coarse particles
         with: {variable: aeronet_ae_440_870, below: 0.6}}
    response_window_days: 7
    response:
      - {variable: chl, location: gibraltar_20km}
      - {variable: kd490, location: gibraltar_20km}
      - {variable: par, location: gibraltar_20km}
  # Marine heatwaves (Hobday et al. 2016): SST above the seasonal 90th percentile for 5+ days.
  marine_heatwaves:
    variable: sst
    locations: [gibraltar_20km, bay_of_gibraltar, gibraltar_eastside, strait_of_gibraltar, western_alboran]
    baseline: [1991, 2020]         # 30-year reference period (uses all years if the record is shorter)
    min_days: 5
    max_gap_days: 2
    extra_variables: [temp_10m, temp_30m, temp_50m]   # heatwaves below the surface, from the physics model

  # Coastal upwelling on the Spanish Alboran coast: offshore Ekman transport from the wind.
  upwelling:
    wind: {location: gibraltar_airport, sources: [openmeteo_era5, openmeteo_forecast]}
    coast_bearing: 70                # the coast runs towards ENE with the sea to the right
    latitude: 36.5
    threshold: 500                   # m3 s-1 per km of coast, about a steady 6 m/s westerly
    min_days: 2
    max_gap_days: 1
    response_window_days: 7
    response_lag_days: 3
    response:
      - {variable: sst, location: western_alboran}
      - {variable: sst, location: gibraltar_20km}
      - {variable: chl, location: western_alboran}
      - {variable: nitrate, location: western_alboran}

  # Light reaching the seabed at these depths, from satellite PAR and KD490 (Morel et al. 2007 KdPAR)
  seabed_light:
    depths: [5, 10, 15, 20]

  # Chlorophyll blooms: 3+ days above the seasonal 90th percentile (cloud gaps up to 3 days bridged)
  # Rain and run-off. Rolling 7- and 30-day totals are published as their own series (with normals),
  # and rain events are listed so blooms can name heavy rain as a possible trigger.
  #   heavy_mm:    a wet spell with any day at or above this counts as heavy rain
  #   flush_mm:    a wet spell totalling at least this, after dry_days with less than wet_mm a day,
  #                counts as a "first flush" (the first proper rain to wash a dry catchment out)
  rain:
    variable: precip
    location: gibraltar_airport
    wet_mm: 1
    heavy_mm: 20
    flush_mm: 10
    dry_days: 30
    windows: [7, 30]

  blooms:
    variable: chl
    locations: [gibraltar_20km, bay_of_gibraltar, gibraltar_eastside, strait_of_gibraltar, western_alboran]
    percentile: 0.9
    min_days: 3
    max_gap_days: 2
    interp_days: 3
    min_clear_days: 2
    trigger_lookback_days: 10

  tides:
    source: ioc_gibraltar
    location: gibraltar_tide_gauge
    predict_days: 15                 # a full spring-neap cycle for the dashboard
    sample_offset_minutes: 30        # hourly means are labelled at the start of the hour, so they sit 30 min later
    datum: chart                     # heights above chart datum, as printed tide tables use ("msl" for mean sea level)
    max_daily_offset_m: 0.5          # drop days more than this from their neighbours (sensor faults, datum jumps)
    # chart_datum_offset_m: 0.48     # set this to the published depth of chart datum below mean sea level
                                     # if the dashboard's own estimate does not match the tide tables

  # NEMO citizen science sightings. The source is a CSV in the repo for now; the API swaps in here.
  wildlife:
    enabled: true
    species_file: species.yaml
    private_dir: private            # not published to the website: the matched file and stranding candidates
    include_notes: false            # keep written notes out of the run files: they sometimes name people,
                                    # and files attached to a run on a public repository are public
    source:
      # Preferred: a private link to the export, held in the GitHub secret named here. Nothing
      # personal is then committed to this public repository. The API key replaces this later.
      url_env: NEMO_CSV_URL
      csv: nemo/nemo_gibraltar_clean.csv   # fallback: only commit an export with the User and Notes columns removed
      time_format:                  # blank = work the format out from the file (the clean export is
                                    # ISO, 2018-06-09 13:16; the raw NEMO export is 09/06/2018 13:16)
      timezone: Europe/Gibraltar    # NEMO records local time; midnight means the time was not known
    bbox: [-6.0, 35.6, -4.3, 36.6]  # records outside this are set aside as not local
    recent_days: 30
    bloom_min_records: 3            # a gelatinous "bloom" day: at least this many records
    bloom_min_share: 0.4            # and at least this share of everything reported that day

    # Species followed closely, with the sea conditions behind every appearance. Thresholds are here
    # rather than in the code so they can be argued with: each one decides whether a driver is named
    # on the card, and none of them changes the underlying numbers.
    watch_species:
      - species: "Marine Phytoplankton|Sea sparkle"
        name: Sea sparkle
        scientific: Noctiluca scintillans
        area: bay_of_gibraltar     # blank = wherever it is most often reported
        max_gap_days: 3            # reports this close together are one appearance
        lead_days: 3               # wind is read over the days before, not the night itself
        upwelling_lead_days: 5
        warm_sea_c: 1.0            # sea this far above the usual for the date counts as warm
        upwelling_threshold: 500   # m3/s per km, same threshold as the upwelling events card
        calm_ratio: 0.8            # wind below this share of the usual counts as calm
        rich_water_ratio: 1.25     # chlorophyll needs this much above the usual to count
        dark_moon_pct: 35          # below this the moon is down enough to see bioluminescence easily
        trigger_lookback_days: 10
        note: >-
          Noctiluca is not a true alga and does not bloom on nutrients alone: it grazes on other
          plankton, so it tends to follow a diatom bloom rather than start one. Warm, calm, stratified
          water lets it gather at the surface, which is when people see it. Records are night-time
          sightings of bioluminescence, so a dark moon makes a bloom easier to notice as well as to
          report.
    # TNP's own strandings log, the record of truth for dead and stranded animals. Held in a
    # spreadsheet and read straight from it, so there is no second copy to keep in step.
    strandings:
      enabled: true
      url_env: STRANDINGS_URL       # private link to the workbook, held in a GitHub secret
      file: strandings/Marine Strandings Log.xlsx   # fallback if the link is not set
      sheet:                        # blank = the first sheet
      recent_days: 365
      # Which kinds count as marine. Land birds stay in the log and are shown separately rather
      # than dropped: a Griffon Vulture on Camp Bay is a real record, it is just not an ocean one.
      marine_groups: [cetacean, turtle, shark or ray, seabird, fish]

    conditions:                   # attached to every record; "area" means the record's own sea area
      - {variable: sst, location: area}
      - {variable: chl, location: area}
      - {variable: kd490, location: area}
      - {variable: temp_10m, location: area}
      - {variable: salinity, location: area}
      - {variable: nitrate, location: area}
      - {variable: current_speed, location: area}
      - {variable: par, location: area}
      - {variable: wave_hs, location: europa_point}
      - {variable: wind_speed, location: gibraltar_airport}
      - {variable: wind_dir, location: gibraltar_airport, anomaly: false}
